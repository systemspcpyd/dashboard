<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS Dashboard</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            line-height: 1.6; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            background-color: #121212; 
            color: #e0e0e0; 
        }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; color: #ffffff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { 
            padding: 20px; 
            border: 1px solid #333; 
            border-radius: 8px; 
            text-decoration: none; 
            color: #b0b0b0; 
            background-color: #1e1e1e;
            transition: transform 0.2s, border-color 0.2s, color 0.2s; 
        }
        .card:hover { 
            border-color: #007bff; 
            color: #ffffff;
            transform: translateY(-5px); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        }
        .card h3 { margin-top: 0; color: #007bff; }
    </style>
</head>
<body>

    <h1>System Specialist Dashboard</h1>
    <p>A central hub for active projects.</p>

    <div class="grid">
        <a href="https://systemspcpyd.github.io/payment-page/" class="card">
            <h3>Payment Page Testing</h3>
            <p>Hosted and Non-hosted testing for MPI, PAG and Dummy PAG.</p>
        </a>

        <a href="https://systemspcpyd.github.io/stress-testing/" class="card">
            <h3>Stress Testing</h3>
            <p>PAG Performance testing using dummy wallet.</p>
        </a>
    </div>

</body>
</html>
