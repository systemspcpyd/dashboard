<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment QR & Status Inquiry</title>
    <link rel="stylesheet" href="../css/form.css">
    <style>
        /* Extra overrides to fit the dark theme */
        body { background-color: #121212 !important; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .qr-card { background: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; width: 400px; text-align: center; }
        
        #qr-code-image { width: 220px; height: 220px; margin: 10px auto; display: none; border: 1px solid #333; }
        .timer-display { font-size: 32px; font-weight: bold; color: #ff4757; margin: 10px 0; font-family: monospace; }
        
        /* Reusing your form.css classes for inputs */
        .controls label { color: #e0e0e0; }
        .controls input { background-color: #1e1e1e !important; border: 1px solid #333 !important; color: #fff !important; }
        .btn-check { padding: 10px 20px; background-color: #1e1e1e; color: #007bff; border: 1px solid #007bff; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-check:hover { background-color: #007bff; color: white; }
    </style>
</head>
<body>

    <div class="payment-container">
        <div class="qr-card">
            <h2 style="color: #fff; margin-top: 0;">DuitNow QR</h2>
            
            <div id="qr-section" style="display: none;">
                <p style="font-size: 14px; color: #b0b0b0;">Scan with your mobile banking app</p>
                <img id="qr-code-image" src="">
                <div id="countdown-display" class="timer-display">00:00</div>
                <p style="font-size: 12px; color: #666; margin-bottom: 20px;">Ref: <span id="ref-display"></span></p>
                <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
            </div>

            <div class="controls" style="padding: 0;">
                <div style="text-align: left; margin-bottom: 15px;">
                    <label>TRANSACTION ID</label>
                    <input type="text" id="manual_trxn_id" placeholder="PAGUAT...">
                </div>

                <div style="text-align: left; margin-bottom: 15px;">
                    <label>AMOUNT (IN CENTS)</label>
                    <input type="number" id="manual_amount" placeholder="100">
                </div>
            </div>

            <button class="btn-check" onclick="triggerInquiry()">Check Status Now</button>
            <p id="inquiry-status-text" style="color: #e0e0e0;"></p>
        </div>
    </div>
    <form id="inq-form" method="post" action="https://linkv2.paydee.co/mpigw/mpReq" target="inq_frame" style="display:none;">
        <input type="hidden" name="MPI_RETURN_URL" value="https://systemspc.vercel.app/api/callback">
        <input type="hidden" name="MPI_TRANS_TYPE" value="INQ">
        <input type="hidden" name="MPI_MERC_ID" value="000000000000003">
        <input type="hidden" name="MPI_PURCH_DATE" id="INQ_PURCH_DATE">
        <input type="hidden" name="MPI_TRXN_ID" id="INQ_TRXN_ID">
        <input type="hidden" name="MPI_ORI_TRXN_ID" id="INQ_ORI_TRXN_ID">
        <input type="hidden" name="MPI_PURCH_CURR" value="458">
        <input type="hidden" name="MPI_PURCH_AMT" id="INQ_PURCH_AMT">
        <textarea name="MPI_MAC" id="INQ_MAC"></textarea>
    </form>
    <iframe name="inq_frame" style="display:none;"></iframe>

    <script src="inquiry-handler.js"></script>
    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const qr = params.get('MPI_QR_CODE');
            const expiry = params.get('MPI_QR_EXPIRY_SECONDS');
            const tid = params.get('MPI_TRXN_ID') || params.get('MPI_TXN_ID');
            const amt = params.get('MPI_PURCH_AMT');

            // 1. Fill inputs (Manual entry fallback)
            if (tid) document.getElementById('manual_trxn_id').value = tid;
            if (amt) document.getElementById('manual_amount').value = amt;

            // 2. Setup QR display and Timer
            if (qr && expiry) {
                document.getElementById('qr-code-image').src = "data:image/png;base64," + qr;
                document.getElementById('qr-code-image').style.display = "block";
                document.getElementById('qr-section').style.display = "block";
                document.getElementById('ref-display').innerText = tid;
                startTimer(parseInt(expiry));
            }
        };

        function startTimer(seconds) {
            let timer = seconds;
            const display = document.getElementById('countdown-display');
            const countdown = setInterval(function () {
                let minutes = parseInt(timer / 60, 10);
                let seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(countdown);
                    display.textContent = "EXPIRED";
                    display.style.color = "#888";
                }
            }, 1000);
        }
    </script>
</body>
</html>
