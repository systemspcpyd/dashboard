    <title>MPI Test Automation Dashboard</title>
    <style>
        .container { display: flex; gap: 20px; margin-top: 20px; padding: 20px; }
        .panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
        th { background-color: #007bff; color: white; }
        .success { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        .controls { margin-bottom: 15px; }
    </style>

<body>

<div class="container">
    <!-- LEFT PANEL: Test Cases & Runner Controls -->
    <div class="panel">
        <h3>Test Cases Configuration</h3>
        <div class="controls">
            <button onclick="runAllTests()">▶ Run All Active Test Cases</button>
            <button onclick="saveTestData()" style="background: #28a745; color: white;">💾 Save Test Data</button>
            <button onclick="resetTestData()" style="background: #dc3545; color: white;">🔄 Reset Defaults</button>
        </div>
        
        <table id="testCasesTable">
            <thead>
                <tr>
                    <th>Active</th>
                    <th>#</th>
                    <th>MPI_TRANS_TYPE</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated dynamically via script -->
            </tbody>
        </table>
    </div>

    <!-- RIGHT PANEL: Results Log -->
    <div class="panel">
        <h3>Execution Results</h3>
        <div id="summary" style="margin-bottom: 10px; font-weight: bold;"></div>
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Test</th>
                    <th>Trans Type</th>
                    <th>Duration</th>
                    <th>TRXN ID</th>
                    <th>Error Code</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Results populated here -->
            </tbody>
        </table>
    </div>
</div>

        const defaultTestCases = [
            { id: 1, active: true, type: "SALES" },
            { id: 2, active: true, type: "INITRECURR" },
            { id: 3, active: true, type: "PRERECURR" },
            { id: 4, active: true, type: "RECURR" },
            { id: 5, active: true, type: "VSALES" },
            { id: 6, active: true, type: "REFUND" },
            { id: 7, active: true, type: "PREAUTH" },
            { id: 8, active: true, type: "SALESCOMPL" },
            { id: 9, active: true, type: "N3D_RECURR" },
            { id: 10, active: true, type: "RFN3DRECUR" }
        ];

        let testCases = JSON.parse(localStorage.getItem('mpi_test_cases')) || defaultTestCases;

        window.onload = function() {
            renderTable();
        };

        function renderTable() {
            const tbody = document.querySelector("#testCasesTable tbody");
            if (!tbody) return;
            tbody.innerHTML = "";
            testCases.forEach((tc, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><input type="checkbox" ${tc.active ? 'checked' : ''} onchange="toggleActive(${index}, this.checked)"></td>
                        <td>${tc.id}</td>
                        <td><b>${tc.type}</b></td>
                        <td><button type="button" onclick="runSingleTest(${index})">Run Test</button></td>
                    </tr>
                `;
            });
        }

        function toggleActive(index, status) {
            testCases[index].active = status;
            localStorage.setItem('mpi_test_cases', JSON.stringify(testCases));
        }

        function saveTestData() {
            localStorage.setItem('mpi_test_cases', JSON.stringify(testCases));
            alert("Test cases configuration saved to your browser localStorage!");
        }

        function resetTestData() {
            localStorage.removeItem('mpi_test_cases');
            testCases = JSON.parse(JSON.stringify(defaultTestCases));
            renderTable();
            alert("Test cases reset to default values.");
        }

        function initFields() {
            let d = new Date();
            let x = d.getFullYear() + 
                    (d.getMonth() + 1).toString().padStart(2, '0') + 
                    d.getDate().toString().padStart(2, '0') + 
                    d.getHours().toString().padStart(2, '0') + 
                    d.getMinutes().toString().padStart(2, '0') + 
                    d.getSeconds().toString().padStart(2, '0');
            
            document.forms["form"]["MPI_PURCH_DATE"].value = x;
            document.forms["form"]["MPI_TRXN_ID"].value = "MPIOTO" + x;
        }

        async function mkReq(mid, trxnId) {
            try {
                const response = await fetch(KEY_EXCHANGE_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "merchantId": mid,
                        "pubKey": PUBLICKEY,
                        "purchaseId": trxnId
                    })
                });
                return await response.json(); 
            } catch (error) {
                console.error("Key Exchange Exception:", error);
                return { errorCode: "EXCEPTION", errorMessage: error.message };
            }
        }

        function generateMacForForm() {
            let form = document.forms["form"];
            let rawString = 
                form["MPI_TRANS_TYPE"].value +
                form["MPI_MERC_ID"].value +
                form["MPI_PAN"].value +
                form["MPI_CARD_HOLDER_NAME"].value +
                form["MPI_PAN_EXP"].value +
                form["MPI_CVV2"].value +
                form["MPI_TRXN_ID"].value +
                form["MPI_ORI_TRXN_ID"].value +
                form["MPI_PURCH_DATE"].value +
                form["MPI_PURCH_CURR"].value +
                form["MPI_PURCH_AMT"].value +
                form["MPI_EMAIL"].value +
                form["MPI_MOBILE_PHONE"].value +
                form["MPI_MOBILE_PHONE_CC"].value +
                form["MPI_ADDITIONAL_INFO_IND"].value +
                form["MPI_RECURR_FREQ"].value +
                form["MPI_RECURR_EXPIRY"].value;
        
            try {
                let rsaKey = KEYUTIL.getKey(PRIVATE_KEY);
                let sig = new KJUR.crypto.Signature({"alg": "SHA256withRSA"});
                sig.init(rsaKey); 
                sig.updateString(rawString);
                let sigValueHex = sig.sign();
                let base64Value = hextob64(sigValueHex);
                form["MPI_MAC"].value = base64Value.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
            } catch (e) {
                console.error("Signing Error:", e);
            }
        }

        async function executeTest(tc) {
            let form = document.forms["form"];
            form["MPI_TRANS_TYPE"].value = tc.type;
            initFields();

            let mid = form["MPI_MERC_ID"].value;
            let trxnId = form["MPI_TRXN_ID"].value;

            let startTime = performance.now();

            try {
                // 1. Perform Key Exchange (mkReq)
                let mkRes = await mkReq(mid, trxnId);
                if (!mkRes || mkRes.errorCode !== "000") {
                    let endTime = performance.now();
                    return {
                        id: tc.id,
                        type: tc.type,
                        duration: ((endTime - startTime) / 1000).toFixed(2) + "s",
                        trxnId: trxnId,
                        errorCode: "MK_FAIL_" + (mkRes ? mkRes.errorCode : "UNKNOWN"),
                        status: false
                    };
                }

                // 2. Generate MAC for Payload with all fields intact
                generateMacForForm();

                // 3. Disable empty fields just like your manual script before building URLSearchParams
                const inputs = form.querySelectorAll('input, select, textarea');
                inputs.forEach(input => {
                    if (!input.value.trim()) {
                        input.disabled = true;
                    }
                });

                const formData = new FormData(form);
                const payload = new URLSearchParams();
                formData.forEach((value, key) => {
                    if (value.trim() !== "") payload.append(key, value);
                });

                // Re-enable form inputs immediately after payload generation
                inputs.forEach(input => input.disabled = false);

                const mpResponse = await fetch(PAYMENT_REQUEST_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: payload
                });
                const mpResult = await mpResponse.json();

                let endTime = performance.now();
                let duration = ((endTime - startTime) / 1000).toFixed(2) + "s";
                let errorCode = mpResult.MPI_ERROR_CODE || mpResult.errorCode || "99";
                let isSuccess = (errorCode === "00" || errorCode === "000");

                return {
                    id: tc.id,
                    type: tc.type,
                    duration: duration,
                    trxnId: mpResult.MPI_TRXN_ID || trxnId,
                    errorCode: errorCode,
                    status: isSuccess
                };

            } catch (error) {
                let endTime = performance.now();
                console.error(error);
                return {
                    id: tc.id,
                    type: tc.type,
                    duration: ((endTime - startTime) / 1000).toFixed(2) + "s",
                    trxnId: trxnId,
                    errorCode: "EXCEPTION",
                    status: false
                };
            }
        }

        async function runSingleTest(index) {
            let tc = testCases[index];
            document.querySelector("#resultsTable tbody").innerHTML = "<tr><td colspan='6'>Running Test " + tc.id + "...</td></tr>";
            
            let res = await executeTest(tc);
            
            let resBody = `
                <tr>
                    <td>${res.id}</td>
                    <td>${res.type}</td>
                    <td>${res.duration}</td>
                    <td>${res.trxnId}</td>
                    <td>${res.errorCode}</td>
                    <td class="${res.status ? 'success' : 'fail'}">${res.status ? 'SUCCESS' : 'FAILED'}</td>
                </tr>
            `;
            document.querySelector("#resultsTable tbody").innerHTML = resBody;
            document.getElementById("summary").innerText = `Completed Test ${tc.id}: ${res.status ? 'SUCCESS ✅' : 'FAILED ❌'}`;
        }

        async function runAllTests() {
            const activeCases = testCases.filter(tc => tc.active);
            if (activeCases.length === 0) {
                alert("No active test cases selected!");
                return;
            }

            let resultsBody = document.querySelector("#resultsTable tbody");
            resultsBody.innerHTML = "";
            document.getElementById("summary").innerText = "Running all active test cases...";

            let passedCount = 0;

            for (let tc of activeCases) {
                resultsBody.innerHTML += `<tr id="row-${tc.id}"><td>${tc.id}</td><td>${tc.type}</td><td colspan="4">Running...</td></tr>`;
                
                let res = await executeTest(tc);
                if (res.status) passedCount++;

                let targetRow = document.getElementById(`row-${tc.id}`);
                if (targetRow) {
                    targetRow.outerHTML = `
                        <tr>
                            <td>${res.id}</td>
                            <td>${res.type}</td>
                            <td>${res.duration}</td>
                            <td>${res.trxnId}</td>
                            <td>${res.errorCode}</td>
                            <td class="${res.status ? 'success' : 'fail'}">${res.status ? 'SUCCESS' : 'FAILED'}</td>
                        </tr>
                    `;
                }
            }

            document.getElementById("summary").innerText = `Finished! Passed: ${passedCount} / ${activeCases.length}`;
        }
    </script>
